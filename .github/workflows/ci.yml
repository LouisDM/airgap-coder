name: CI

on:
  push:
    branches: [main]
  pull_request:
  # issue-agent 用 GITHUB_TOKEN 推分支/开 PR，GitHub 为防递归不会为这类事件
  # 产生 workflow run，所以它必须能显式触发本流水线来验证自己的改动：
  #   gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

# 说明：真正的功能测试（scripts/smoke.py / test-codex.sh）需要一个活的
# LiteLLM 网关和真实模型 API Key，CI 环境两者都没有。所以这里只做静态验证：
# 语法、CLI 可执行性、以及最关键的——配置生成器的输出是否正确。
# 配置生成器是整个项目最容易出错的地方（协议开关、参数名、profile 文件结构）。

jobs:
  static:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"   # 与 macOS 自带版本对齐，避免用到更新的语法

      - name: 每个测试脚本都必须被 CI 调用
        # 踩过三次的坑：测试脚本进了仓库，但忘了在下面加一行调用它，于是 CI
        # 照样全绿、脚本从不执行，制造「有门禁」的假象（test-doctor-probe.sh、
        # test-lc-secrets.sh、test-lc-commands.sh 各中过一次）。
        # 这条元断言从根上堵住这个模式：新增测试脚本却没接进来，CI 直接红。
        run: |
          set -euo pipefail
          miss=0
          for f in scripts/test-*.sh; do
            base=$(basename "$f")
            # 确实跑不了的脚本在自己头部写 `# ci-exempt: <理由>` 显式豁免，
            # 理由跟着脚本走，不散落在 ci.yml 里
            if grep -q '^# ci-exempt:' "$f"; then
              echo "  ⏭  $base 已显式豁免：$(grep -m1 '^# ci-exempt:' "$f" | sed 's/^# ci-exempt: *//')"
              continue
            fi
            # 只认「作为命令被执行」的引用，写在注释里不算
            grep -qE "run:[^#]*\b(bash|sh)[[:space:]]+scripts/$base\b" .github/workflows/ci.yml \
              || { echo "::error::$f 没有被 ci.yml 执行——它现在只是躺在仓库里"; miss=1; }
          done
          [ "$miss" -eq 0 ] && echo "✅ 所有 scripts/test-*.sh 都接进了 CI"
          exit $miss

      - name: Python 语法检查
        run: python3 -m py_compile bin/lc scripts/*.py

      - name: Shell 语法检查
        run: bash -n scripts/*.sh docker/entrypoint.sh

      - name: CLI 可执行
        run: |
          python3 bin/lc --help
          python3 bin/lc help
          bash scripts/test-version.sh

      - name: 开源项目元数据与供应链约束
        run: python3 scripts/test-project-metadata.py

      - name: 容器入口与本地 Codex 审查包装器
        run: |
          bash scripts/test-entrypoint.sh
          bash scripts/test-codex-review-script.sh

      - name: doctor 的 tool calling 探测
        # issue #1 的门禁：桩上游按 7 种方式作答，断言 doctor 每个判定分支。
        # 没有这条，「只测连通性测不出 tool calling」这个问题会悄悄回归。
        run: bash scripts/test-doctor-probe.sh

      - name: lc export 的包内容校验
        # issue #5 的门禁。这个包是唯一一次跨隔离网传递，到了内网没有补救手段，
        # 所以重点断言 .env / 生成物 / 会话库不进包，并验证 registry 默认包含、
        # --no-registry 可排除、旧版明文 header 会阻断导出，最后真跑 install.sh。
        run: bash scripts/test-export.sh

      - name: 机密只进 .env 这个不变量
        # issue #12 第一梯队的门禁：40 条断言覆盖 init / add / rm / migrate，
        # 钉住「密钥、地址、header 值只出现在 .env，registry 只存变量名」。
        # 不需要 docker / 网络 / API Key，约 1 秒。
        run: bash scripts/test-lc-secrets.sh

      - name: use / ls / up / down / status 的行为门禁
        # issue #12 第二梯队。这些命令此前只有 py_compile 兜底，行为零覆盖。
        # 重点是「网关不可达时给一句干净的话而不是 traceback」这类分支——
        # 它们只在出故障时才走到，正是最容易悄悄坏掉的地方。
        run: bash scripts/test-lc-commands.sh

      - name: 版本号一致性
        run: bash scripts/test-version.sh

      - name: 容器 entrypoint 的参数路由与必需变量校验
        run: bash scripts/test-entrypoint.sh

      - name: 本地 codex review 脚本不碰已提交的凭证
        run: bash scripts/test-codex-review-script.sh

      - name: 配置生成器输出校验
        run: |
          set -euo pipefail
          cp registry.example.json registry.json
          cat > .env <<'EOF'
          LITELLM_MASTER_KEY=sk-ci-fake
          GATEWAY_PORT=4000
          KEY_INTRANET=fake-key
          KEY_INTRANET_BASE=http://vllm.example.local:8000/v1
          EOF
          python3 bin/lc sync

          echo "--- 生成的 litellm/config.yaml ---"
          cat litellm/config.yaml
          echo "--- 生成的 codex/intranet.config.toml ---"
          cat codex/intranet.config.toml

          # 这些断言对应项目里踩过的坑，回归了就红
          grep -q 'use_chat_completions_api: true' litellm/config.yaml \
            || { echo "::error::缺 use_chat_completions_api，/v1/responses 会被透传给上游导致 404"; exit 1; }
          grep -q 'chat_template_kwargs' litellm/config.yaml \
            || { echo "::error::vLLM 的关思考参数丢失"; exit 1; }
          grep -q 'wire_api = "responses"' codex/config.toml \
            || { echo "::error::wire_api 必须是 responses，Codex 0.145+ 已移除 chat"; exit 1; }
          grep -q 'include_apply_patch_tool = true' codex/intranet.config.toml \
            || { echo "::error::缺 include_apply_patch_tool，模型会退化成 shell heredoc 写文件"; exit 1; }
          grep -q 'model_context_window' codex/intranet.config.toml \
            || { echo "::error::缺上下文预算声明"; exit 1; }

      - name: registry.json 可提交，但必须不含任何机密
        # issue #4 的门禁。registry.json 现在是团队共享的结构定义，会被提交，
        # 所以「它里面没有地址也没有密钥」从一个约定变成了必须守住的不变量：
        # 一旦 lc 把某个值直接写进 registry 而不是写成变量名，就是泄漏。
        run: |
          set -euo pipefail
          python3 - <<'PYCHK'
          import json, re, sys
          reg = json.load(open("registry.json"))
          bad = []
          def walk(node, path):
              if isinstance(node, dict):
                  for k, v in node.items():
                      walk(v, path + "." + str(k))
              elif isinstance(node, list):
                  for i, v in enumerate(node):
                      walk(v, "%s[%d]" % (path, i))
              elif isinstance(node, str):
                  if re.search(r"https?://", node):
                      bad.append((path, node, "出现了 URL —— 地址应该只在 .env 里"))
                  elif re.match(r"^(sk|gho|ghp|github_pat)[-_]", node):
                      bad.append((path, node[:12] + "...", "疑似密钥"))
                  elif len(node) >= 32 and re.match(r"^[A-Za-z0-9_\-]+$", node) \
                       and not node.startswith("KEY_"):
                      bad.append((path, node[:12] + "...", "疑似密钥（长随机串且不是 KEY_ 变量名）"))
          walk(reg, "registry")
          for p, v, why in bad:
              print("::error::%s = %r —— %s" % (p, v, why))
          sys.exit(1 if bad else 0)
          PYCHK
          echo "✅ registry.json 只含结构定义与变量名"

      - name: .env 必须被 gitignore，且工作区无残留
        run: |
          set -euo pipefail
          git check-ignore -q .env \
            || { echo "::error::.env 没有被 .gitignore 排除，密钥会泄漏"; exit 1; }
          # registry.json 现在是可提交文件，前面步骤造的那份是测试用的假数据，
          # 不能留在工作区冒充真配置
          rm -f registry.json .env
          test -z "$(git status --porcelain --untracked-files=normal)" \
            || { echo "::error::生成物污染了工作区，说明有文件没被 gitignore:"; git status --short; exit 1; }

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 构建离线开发镜像
        run: docker build -f docker/Dockerfile -t airgap-coder:ci .
      - name: entrypoint 缺参数时应当明确报错
        run: |
          if docker run --rm airgap-coder:ci exec "test" 2>&1 | grep -q 'GATEWAY_URL'; then
            echo "✅ 缺 GATEWAY_URL 时给出了明确提示"
          else
            echo "::error::entrypoint 没有校验必需的环境变量"; exit 1
          fi

      - name: 无 GPU 的 Responses → Chat Completions 桥接
        run: bash scripts/test-litellm-bridge.sh
