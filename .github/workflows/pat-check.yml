name: PAT Check

# 一次性诊断：逐项测 AGENT_PAT 能不能干 agent 需要的每件事。
# 定位完就删。不调用任何模型，只跑 gh 命令，成本为零。

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.AGENT_PAT }}
          fetch-depth: 0

      - name: 逐项探测 PAT 权限
        env:
          GH_TOKEN: ${{ secrets.AGENT_PAT }}
          REPO: ${{ github.repository }}
        run: |
          fail=0
          probe() {
            desc="$1"; shift
            if out=$("$@" 2>&1); then
              echo "  ✅ $desc"
            else
              echo "  ❌ $desc"
              echo "     $(echo "$out" | head -2 | tr '\n' ' ')"
              fail=1
            fi
          }

          echo "== 身份 =="
          gh api /user --jq '"  token 属主: " + .login' 2>&1 || echo "  ❌ 读不到 /user（细粒度 PAT 正常，不算错）"

          echo "== 读 =="
          probe "读仓库元信息"  gh api "/repos/$REPO" --jq .full_name
          probe "列 issue"      gh issue list --repo "$REPO" --limit 1
          probe "列 PR"         gh pr list --repo "$REPO" --limit 1
          probe "列 workflow"   gh api "/repos/$REPO/actions/workflows" --jq '.total_count'
          probe "列 run"        gh run list --repo "$REPO" --limit 1

          echo "== 写 =="
          probe "推分支" bash -c '
            git config user.name  "pat-check[bot]"
            git config user.email "pat-check@users.noreply.github.com"
            git checkout -q -b pat-check-probe
            echo probe > .pat-check-probe
            git add .pat-check-probe && git commit -q -m "chore: PAT 权限探测（随后删除）"
            git push -q origin pat-check-probe'
          probe "开 PR" bash -c '
            gh pr create --repo "$REPO" --base main --head pat-check-probe \
              --title "chore: PAT 权限探测" --body "自动创建，随后关闭。" >/dev/null'
          probe "评论 issue" bash -c '
            n=$(gh issue list --repo "$REPO" --state open --limit 1 --json number -q ".[0].number")
            [ -n "$n" ] || exit 0
            gh issue comment "$n" --repo "$REPO" --body "PAT 权限探测（可忽略，随后删除）" >/dev/null'
          probe "触发 workflow_dispatch" \
            gh workflow run ci.yml --repo "$REPO" --ref pat-check-probe

          echo "== 清理 =="
          n=$(gh pr list --repo "$REPO" --head pat-check-probe --json number -q '.[0].number' 2>/dev/null)
          [ -n "$n" ] && gh pr close "$n" --repo "$REPO" --delete-branch >/dev/null 2>&1 || true
          git push -q origin --delete pat-check-probe 2>/dev/null || true
          # 删掉刚才那条探测评论
          i=$(gh issue list --repo "$REPO" --state open --limit 1 --json number -q '.[0].number' 2>/dev/null)
          if [ -n "$i" ]; then
            cid=$(gh api "/repos/$REPO/issues/$i/comments" --jq '[.[] | select(.body | startswith("PAT 权限探测"))] | last | .id' 2>/dev/null)
            [ -n "$cid" ] && [ "$cid" != "null" ] && gh api -X DELETE "/repos/$REPO/issues/comments/$cid" >/dev/null 2>&1 || true
          fi

          echo
          [ "$fail" -eq 0 ] && echo "=== PAT 权限齐全 ===" || echo "=== 有缺失项，见上方 ❌ ==="
          exit $fail
